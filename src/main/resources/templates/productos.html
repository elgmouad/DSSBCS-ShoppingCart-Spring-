<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Catálogo de Productos</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-grid"></i> Catálogo de Productos</h1>
        <a th:href="@{/cart}" class="btn btn-secondary">
            <i class="bi bi-cart3"></i> Ver Carrito
        </a>
    </div>

    <!-- Search & filter -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form th:action="@{/products}" method="get" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="name" class="form-label">Nombre</label>
                    <input type="text" id="name" name="name" class="form-control"
                           placeholder="Buscar por nombre" th:value="${name}">
                </div>
                <div class="col-md-3">
                    <label for="minPrice" class="form-label">Precio mín.</label>
                    <input type="number" step="0.01" min="0" id="minPrice" name="minPrice"
                           class="form-control" th:value="${minPrice}">
                </div>
                <div class="col-md-3">
                    <label for="maxPrice" class="form-label">Precio máx.</label>
                    <input type="number" step="0.01" min="0" id="maxPrice" name="maxPrice"
                           class="form-control" th:value="${maxPrice}">
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                    <a th:href="@{/products}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(products)}" class="alert alert-info text-center">
        <i class="bi bi-info-circle"></i> No se encontraron productos.
    </div>

    <div class="row">
        <div th:each="product : ${products}" class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${product.name}">Nombre</h5>
                    <p class="fw-bold text-success fs-5 flex-grow-1"
                       th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$0.00</p>
                    <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-cart-plus"></i> Agregar al Carrito
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
