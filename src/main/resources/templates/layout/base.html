<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Shopping Cart</title>

        <!-- Bootstrap 5 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
        <!-- Custom CSS -->
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>
    <body class="d-flex flex-column min-vh-100">

        <!-- Navbar -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Alerts -->
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Page content -->
        <main class="flex-grow-1">
            <div class="container mt-4">
                <div th:if="${param.accessDenied}" class="alert alert-danger alert-dismissible fade show">
                    <i class="bi bi-shield-exclamation"></i>
                    No tiene autorización para realizar esta acción.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div layout:fragment="content">
                    <!-- Child pages inject their content here -->
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <th:block layout:fragment="scripts"></th:block>
    </body>
</html>
