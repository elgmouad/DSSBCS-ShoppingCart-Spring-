<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Carrito de Compras</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-cart3"></i> Carrito de Compras</h1>
        <a th:href="@{/products}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Continuar Comprando
        </a>
    </div>

    <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info text-center py-5">
        <i class="bi bi-cart-x display-4"></i>
        <p class="mt-3 mb-0">Tu carrito está vacío.</p>
        <a th:href="@{/products}" class="btn btn-primary mt-3">
            <i class="bi bi-grid"></i> Ver productos
        </a>
    </div>

    <div th:if="${!#lists.isEmpty(cartItems)}">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">
                    <i class="bi bi-bag-check"></i>
                    <span th:text="${#lists.size(cartItems)}">0</span> producto(s)
                </h5>
            </div>
            <ul class="list-group list-group-flush">
                <li th:each="product : ${cartItems}"
                    class="list-group-item d-flex justify-content-between align-items-center">
                    <h6 class="mb-0" th:text="${product.name}">Nombre</h6>
                    <div class="d-flex align-items-center gap-3">
                        <span class="fw-bold text-success"
                              th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$0.00</span>
                        <form th:action="@{/cart/remove/{id}(id=${product.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-danger btn-sm">
                                <i class="bi bi-trash"></i> Eliminar
                            </button>
                        </form>
                    </div>
                </li>
            </ul>
            <div class="card-footer d-flex justify-content-between align-items-center">
                <h5 class="mb-0">
                    Total: <span class="text-success"
                                 th:text="'$' + ${#numbers.formatDecimal(total, 1, 2)}">$0.00</span>
                </h5>
                <form th:action="@{/cart/clear}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-danger">
                        <i class="bi bi-trash3"></i> Vaciar carrito
                    </button>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
