<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Administración de Productos</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-shield-lock"></i> Administrar Productos</h1>
        <div class="d-flex gap-2">
            <a th:href="@{/products}" class="btn btn-secondary">
                <i class="bi bi-grid"></i> Ver Catálogo
            </a>
            <a th:href="@{/admin/export}" class="btn btn-primary">
                <i class="bi bi-download"></i> Descargar SQL
            </a>
        </div>
    </div>

    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Agregar Nuevo Producto</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/products/save}" method="post" th:object="${product}" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-md-7">
                    <label for="name" class="form-label">Nombre</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label for="price" class="form-label">Precio</label>
                    <input type="number" id="price" th:field="*{price}" step="0.01" min="0"
                           class="form-control" required>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-plus-lg"></i> Agregar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0"><i class="bi bi-list-ul"></i> Productos Existentes</h5>
        </div>
        <div th:if="${#lists.isEmpty(products)}" class="card-body text-center text-muted">
            No hay productos registrados.
        </div>
        <ul class="list-group list-group-flush">
            <li th:each="product : ${products}" class="list-group-item">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <strong th:text="${product.name}">Nombre</strong>
                        <p class="mb-0 text-muted"
                           th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$0.00</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/products/edit/{id}(id=${product.id})}"
                           class="btn btn-warning btn-sm">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <form th:action="@{/products/delete/{id}(id=${product.id})}"
                              method="post" class="d-inline-block">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-danger btn-sm"
                                    onclick="return confirm('¿Eliminar este producto?');">
                                <i class="bi bi-trash"></i> Eliminar
                            </button>
                        </form>
                    </div>
                </div>
            </li>
        </ul>
    </div>

</div>
</body>
</html>
